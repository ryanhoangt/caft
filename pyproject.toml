[project]
name = "caft"
version = "0.1.0"
description = "Code for this paper: https://arxiv.org/abs/2507.16795"
readme = "README.md"
authors = [
    { name = "hcasademunt", email = "helena.casademunt@gmail.com" },
    { name = "cadentj", email = "caden.juang@gmail.com" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    # unsloth's single-GPU patch re-execs accelerate's Accelerator.prepare source
    # into its own module globals (unsloth/models/_utils.py:737), so any symbol
    # that body references must exist there. 1.5.2's only gap is is_xpu_available,
    # which is unreachable on CUDA; >=1.8 reference is_torch_version/FP8BackendType
    # on lines that always run, giving "NameError: FP8BackendType is not defined".
    "accelerate==1.5.2",
    "datasets==2.21.0",
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.0",
    "nbformat>=5.10.4",
    "nnsight",
    "transformers==4.48.2",
    "sentence-transformers>=3.4.1",
    "simple-parsing>=0.1.6",
    # torch 2.5.1 is what vllm 0.7.3 pins; cu124 wheels run on the cluster's
    # 12.8 driver, while the default PyPI torch is now a cu130 build that does not.
    "torch==2.5.1",
    "torchtyping>=0.1.5",
    "wandb>=0.19.5",
    "seaborn",
    "vllm==0.7.3",
    "fire",
    "backoff",
    "setuptools",
    # Pinned for two reasons: left free, uv's platform fork downgrades this to
    # 2024.8 on linux-x86_64 (to keep wandb newer), dropping trl and unsloth-zoo;
    # and 2025.4.x imports transformers.models.qwen3, which needs transformers
    # >=4.51 — incompatible with the 4.48.2 pin above, but not declared in
    # unsloth's metadata, so no resolver catches it.
    "unsloth==2025.3.19"
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emergent_misalignment", "spurious_correlations"]

